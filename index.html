function renderAnLargest(txs){
  const largest=txs.filter(t=>t.type==='expense').sort((a,b)=>b.amount-a.amount).slice(0,6);
  const wrap=$('#anLargestWrap');
  if(largest.length===0){ wrap.innerHTML=`<div class="empty" style="padding:32px"><h3>No expenses</h3><p>No expense transactions in this range.</p></div>`; return; }
  wrap.innerHTML=`<div class="table-wrap"><table class="tbl"><thead><tr><th>Transaction</th><th>Date</th><th class="num">Amount</th></tr></thead><tbody>${largest.map(t=>`<tr style="cursor:pointer" onclick="openTransactionModal('${t.id}')"><td><div style="display:flex;align-items:center;gap:10px">${catIconHTML(t.category)}<span style="font-weight:600;font-size:13px">${esc(t.title)}</span></div></td><td style="color:var(--text-muted);font-size:12.5px">${fmtDate(t.date)}</td><td class="num"><span class="amt">${fmtMoney(t.amount)}</span></td></tr>`).join('')}</tbody></table></div>`;
}
function renderAnChanges(startISO, endISO){
  const start=parseDate(startISO), end=parseDate(endISO);
  const days=Math.ceil((end-start)/86400000)+1;
  const prevStart=new Date(start); prevStart.setDate(prevStart.getDate()-days);
  const prevEnd=new Date(start); prevEnd.setDate(prevEnd.getDate()-1);
  const curTxs=Store.txsInRange(startISO,endISO).filter(t=>t.type==='expense');
  const prevTxs=Store.txsInRange(fmtDateISO(prevStart),fmtDateISO(prevEnd)).filter(t=>t.type==='expense');
  const curCat={}, prevCat={};
  curTxs.forEach(t=>{curCat[t.category]=(curCat[t.category]||0)+t.amount;});
  prevTxs.forEach(t=>{prevCat[t.category]=(prevCat[t.category]||0)+t.amount;});
  const cats=[...new Set([...Object.keys(curCat),...Object.keys(prevCat)])];
  const rows=cats.map(c=>{
    const cur=round2(curCat[c]||0), prev=round2(prevCat[c]||0);
    const diff=round2(cur-prev);
    return {c,cur,prev,diff};
  }).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff)).slice(0,6);
  const wrap=$('#anChangesWrap');
  if(rows.length===0){ wrap.innerHTML=`<div class="empty" style="padding:24px"><h3>No data</h3><p>Not enough history to compare.</p></div>`; return; }
  wrap.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px">${rows.map(r=>{
    const cat=catOf(r.c);
    const pct=r.prev>0?round2(r.diff/r.prev*100):0;
    const cls=r.diff>0?'down':r.diff<0?'up':'flat';
    const arr=r.diff>0?'arrowUp':r.diff<0?'arrowDown':'arrowRight';
    return `<div style="display:flex;align-items:center;gap:12px">
      ${catIconHTML(r.c)}
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600">${cat.label}</div>
        <div style="font-size:11.5px;color:var(--text-muted)">${fmtMoney(r.cur)} now · ${fmtMoney(r.prev)} prev</div>
      </div>
      <span class="delta ${cls}">${icon(arr,12)}${Math.abs(pct)}%</span>
      <span class="amt" style="color:${r.diff>0?'var(--danger)':'var(--accent)'};font-size:12.5px;width:80px;text-align:right">${r.diff>0?'+':r.diff<0?'−':''}${fmtMoney(Math.abs(r.diff))}</span>
    </div>`;
  }).join('')}</div>`;
}

function renderGoalsGrid(){
  const goals=Store.state.goals;
  const wrap=$('#goalsGrid');
  if(goals.length===0){
    wrap.innerHTML=`<div class="empty" style="grid-column:1/-1;padding:64px"><h3>No goals yet</h3><p>Create a savings goal to start tracking your progress.</p><button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="openGoalModal()">Create Goal</button></div>`;
    return;
  }
  wrap.innerHTML=goals.map(g=>goalCard(g)).join('');
  // attach contribute handlers
  goals.forEach(g=>{
    const btn=$('#gContrib_'+g.id);
    if(btn) btn.onclick=()=>openContributeModal(g.id);
  });
}

function goalCard(g){
  const pct=g.targetAmount>0?clamp(round2(g.currentAmount/g.targetAmount*100),0,100):0;
  const rem=round2(g.targetAmount-g.currentAmount);
  const cls=pct>=100?'ok':pct>=75?'ok':'ok';
  const target=parseDate(g.targetDate);
  const today=new Date();
  const daysLeft=Math.ceil((target-today)/86400000);
  const done=pct>=100;
  const overdue=daysLeft<0 && !done;
  return `<div class="card goal">
    <div class="goal-head">
      <div class="goal-ic" style="${done?'background:linear-gradient(135deg,var(--accent),#0d8a3a)':''}">${icon(done?'check':'target',20)}</div>
      <div class="goal-meta">
        <div class="goal-name">${esc(g.name)}</div>
        <div class="goal-date">${done?'Goal achieved 🎉':(overdue?'Overdue · ':'Target ')+fmtDate(target)}</div>
      </div>
      <div class="goal-pct">${pct}%</div>
    </div>
    <div class="progress" style="height:10px;margin-bottom:10px"><div class="progress-bar ${cls}" style="width:${pct}%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:12px">
      <span><span style="color:var(--text-muted)">Saved</span> <b style="color:var(--accent)">${fmtMoney(g.currentAmount)}</b></span>
      <span><span style="color:var(--text-muted)">Target</span> <b>${fmtMoney(g.targetAmount)}</b></span>
    </div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">
      ${done?'You reached this goal!':(overdue?'Past target date · ':'')}${rem>0?fmtMoney(rem)+' still to go':'Fully funded'}
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary btn-sm" id="gContrib_${g.id}" style="flex:1">${icon('plus',14)}Contribute</button>
      <button class="btn btn-secondary btn-sm btn-icon" onclick="openGoalModal('${g.id}')" aria-label="Edit">${icon('edit',15)}</button>
      <button class="btn btn-secondary btn-sm btn-icon" style="color:var(--danger)" onclick="deleteGoal('${g.id}')" aria-label="Delete">${icon('trash',15)}</button>
    </div>
  </div>`;
}

/* GOAL FORM */
function openGoalModal(id){
  const editing=!!id;
  const g=editing?Store.state.goals.find(x=>x.id===id):null;
  Modal.open(`
    <div class="modal-head"><div class="modal-title">${editing?'Edit':'Create'} Goal</div><button class="icon-btn" onclick="Modal.close()">${icon('x',18)}</button></div>
    <div class="modal-body"><form id="goalForm" class="form-grid">
      <div class="field full">
        <label>Goal Name</label>
        <input class="input" id="g_name" value="${g?esc(g.name):''}" placeholder="e.g. Emergency Fund" autocomplete="off" />
        <div class="err">Enter a goal name.</div>
      </div>
      <div class="field">
        <label>Target Amount</label>
        <input class="input" id="g_target" type="number" step="0.01" min="0" value="${g?g.targetAmount:''}" placeholder="0.00" />
        <div class="err">Enter a target greater than 0.</div>
      </div>
      <div class="field">
        <label>Current Saved</label>
        <input class="input" id="g_current" type="number" step="0.01" min="0" value="${g?g.currentAmount:'0'}" placeholder="0.00" />
        <div class="hint">Starting amount saved so far.</div>
      </div>
      <div class="field full">
        <label>Target Date</label>
        <input class="input" id="g_date" type="date" value="${g?fmtDateISO(g.targetDate):''}" />
        <div class="err">Pick a target date.</div>
      </div>
    </form></div>
    <div class="modal-foot">
      ${editing?`<button class="btn btn-danger" style="margin-right:auto" onclick="Modal.close();deleteGoal('${g.id}')">${icon('trash',16)}Delete</button>`:''}
      <button class="btn btn-ghost" onclick="Modal.close()">Cancel</button>
      <button class="btn btn-primary" id="goalSave">${editing?'Save changes':'Create goal'}</button>
    </div>
  `);
  $('#goalSave').onclick=()=>{
    let valid=true;
    const setErr=(id,bad)=>{const el=$('#'+id).closest('.field');if(bad){el.classList.add('invalid');valid=false;}else el.classList.remove('invalid');};
    const name=$('#g_name').value.trim();
    const target=parseFloat($('#g_target').value);
    const current=parseFloat($('#g_current').value)||0;
    const date=$('#g_date').value;
    setErr('g_name',!name);
    setErr('g_target',!(target>0));
    setErr('g_date',!date);
    if(!valid) return;
    const data={name, targetAmount:round2(target), currentAmount:round2(current), targetDate:date};
    if(editing){ Store.updateGoal(g.id,data); Toast.success('Updated','Goal saved.'); }
    else { Store.addGoal(data); Toast.success('Created','Goal added.'); }
    Modal.close();
  };
  setTimeout(()=>$('#g_name').focus(),50);
}

/* CONTRIBUTE MODAL */
function openContributeModal(id){
  const g=Store.state.goals.find(x=>x.id===id);
  if(!g) return;
  const rem=round2(g.targetAmount-g.currentAmount);
  Modal.open(`
    <div class="modal-head"><div class="modal-title">Contribute to ${esc(g.name)}</div><button class="icon-btn" onclick="Modal.close()">${icon('x',18)}</button></div>

        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--text-muted)">Remaining to target</span><b class="amt">${fmtMoney(Math.max(0,rem))}</b></div>

    let valid=true;

  const g=Store.state.goals.find(x=>x.id===id);

function forecastCard(label, value, colorVar, iconName, foot){
  return `<div class="card card-pad stat">
    <div class="stat-top"><div class="stat-label">${label}</div><div class="stat-icon" style="background:color-mix(in srgb, var(${colorVar}) 14%, transparent);color:var(${colorVar})">${icon(iconName,18)}</div></div>
    <div class="stat-value">${fmtMoney(value)}</div>
    <div class="stat-foot"><span class="stat-foot-label">${foot}</span></div>
  </div>`;
}
function assumptionRow(label, value, detail){

function notifRow(key, title, desc, checked){
  return `<div class="set-row"><div class="set-info"><h4>${title}</h4><p>${desc}</p></div>
    <label class="switch"><input type="checkbox" data-key="${key}" ${checked?'checked':''} /><span class="switch-slider"></span></label></div>`;
}

/* ---------- CSV Export ---------- */
function exportCSV(){
  const txs=Store.txs().slice().sort((a,b)=>parseDate(b.date)-parseDate(a.date));
  if(txs.length===0){ Toast.info('No data','There are no transactions to export.'); return; }
  const rows=[['Date','Title','Type','Category','Amount','Payment Method','Notes']];
  txs.forEach(t=>{
    const cat=catOf(t.category).label;
    rows.push([fmtDateISO(t.date), t.title, t.type, cat, t.amount.toFixed(2), t.paymentMethod||'', (t.notes||'').replace(/"/g,'""')]);
  });
  const csv=rows.map(r=>r.map(c=>{
    const s=String(c);
    return /[",\n]/.test(s)?'"'+s+'"':s;
  }).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='spendly-transactions-'+todayISO()+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  Toast.success('Exported',`${txs.length} transactions saved as CSV.`);
}

/* ---------- Data management ---------- */
function resetDemoData(){
  Modal.confirm({
    title:'Reset demo data?',
    message:'This restores the original sample data and <b>erases all your changes</b> (transactions, budgets, subscriptions, goals, and settings). This cannot be undone.',
    confirmText:'Reset everything',
    onConfirm:()=>{ Store.reset(); Toast.success('Demo data restored','Sample data has been reset.'); Router.navigate('overview'); Router.renderUser(); updateThemeIcon(); }
  });
}
function clearAllData(){
  Modal.confirm({
    title:'Clear all data?',
    message:'This permanently deletes <b>every transaction, budget, subscription, and goal</b>. Settings will be kept. This cannot be undone.',
    confirmText:'Delete everything',
    onConfirm:()=>{
      Store.state.transactions=[]; Store.state.budgets=[]; Store.state.subscriptions=[]; Store.state.goals=[];
      Store.emit();
      Toast.success('Data cleared','All financial records were deleted.');
      Router.navigate('overview');
    }
  });
}
